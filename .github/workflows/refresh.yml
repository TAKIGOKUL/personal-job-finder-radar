name: Refresh jobs

on:
  schedule:
    - cron: "30 1 * * *"   # every day at 07:00 IST
  workflow_dispatch: {}     # "Run workflow" button = refresh now
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect jobs
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/radar.py
      - name: Commit data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

  # Upload and deploy run as separate jobs: the artifact is fully finalized before
  # deploy-pages looks it up (doing both in one job raced and failed once).
  build-site:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: first_try
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying
        if: steps.first_try.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
